backend:
  name: git-gateway
  branch: main

media_folder: "/images/chatons"
public_folder: "/images/chatons"

collections:
  - name: "chatons"
    label: "Chatons disponibles"
    files:
      - name: "liste"
        label: "Liste des chatons"
        file: "data/chatons.json"
        fields:
          - label: "Chatons"
            name: "chatons"
            widget: "list"
            summary: "{{nom}} — {{statut}}"
            fields:
              - {label: "Nom", name: "nom", widget: "string"}
              - label: "Sexe"
                name: "sexe"
                widget: "select"
                options: ["Mâle", "Femelle"]
              - {label: "Couleur", name: "couleur", widget: "string"}
              - {label: "Lignée", name: "lignee", widget: "string", required: false}
              - label: "Date de naissance"
                name: "date_naissance"
                widget: "string"
                required: false
                hint: "ex : 17/08/2026"
              - label: "Prix"
                name: "prix"
                widget: "string"
                hint: "ex : 1500€"
              - label: "Statut"
                name: "statut"
                widget: "select"
                options: ["Disponible", "Réservé"]
                default: "Disponible"
              - label: "Photo"
                name: "photo"
                widget: "image"
                required: false
              - label: "Caractère (affiché sur sa fiche détaillée)"
                name: "caractere"
                widget: "string"
                required: false
                hint: "Une courte phrase, affichée entre guillemets"
              - label: "Père"
                name: "pere"
                widget: "string"
                required: false
                hint: "Tape le nom exact d'un de tes Reproducteurs pour créer un lien automatique vers sa fiche, sinon juste le nom en texte."
              - label: "Mère"
                name: "mere"
                widget: "string"
                required: false
                hint: "Tape le nom exact d'une de tes Reproductrices pour créer un lien automatique vers sa fiche, sinon juste le nom en texte."

  - name: "reproductrices"
    label: "Nos Reproductrices"
    files:
      - name: "liste"
        label: "Liste des reproductrices"
        file: "data/reproductrices.json"
        fields:
          - label: "Reproductrices"
            name: "reproductrices"
            widget: "list"
            summary: "{{nom}}"
            fields:
              - {label: "Nom", name: "nom", widget: "string"}
              - {label: "Chatterie d'origine", name: "chatterie_origine", widget: "string", required: false}
              - {label: "Couleur", name: "couleur", widget: "string"}
              - {label: "Lignée", name: "lignee", widget: "string"}
              - {label: "Date de naissance", name: "date_naissance", widget: "string", required: false}
              - label: "Caractère"
                name: "caractere"
                widget: "string"
                hint: "Une courte phrase, affichée entre guillemets"
              - {label: "Père", name: "pere", widget: "string", required: false}
              - {label: "Mère", name: "mere", widget: "string", required: false}
              - label: "Photo"
                name: "photo"
                widget: "image"
                required: false
                media_folder: "/images/chats"
                public_folder: "/images/chats"
              - label: "Afficher sur la page Reproductrices"
                name: "visible"
                widget: "boolean"
                default: true
                hint: "Décoche pour la masquer de la liste publique — elle pourra quand même s'afficher comme mère sur la fiche d'un chaton."

  - name: "articles"
    label: "Nos Articles"
    files:
      - name: "liste"
        label: "Liste des articles"
        file: "data/articles.json"
        fields:
          - label: "Articles"
            name: "articles"
            widget: "list"
            summary: "{{titre}} — {{date}}"
            fields:
              - {label: "Titre", name: "titre", widget: "string"}
              - label: "Identifiant pour le lien (slug)"
                name: "slug"
                widget: "string"
                hint: "Sans espace ni accent ni majuscule, ex : mon-super-article. Ne le change plus une fois publié."
              - {label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false}
              - label: "Extrait (affiché dans la liste des articles)"
                name: "extrait"
                widget: "text"
                hint: "2-3 phrases maximum"
              - label: "Image de couverture"
                name: "image"
                widget: "image"
                required: false
                media_folder: "/images/articles"
                public_folder: "/images/articles"
              - label: "Contenu de l'article"
                name: "corps"
                widget: "markdown"
                media_folder: "/images/articles"
                public_folder: "/images/articles"

  - name: "reproducteurs"
    label: "Nos Reproducteurs"
    files:
      - name: "liste"
        label: "Liste des reproducteurs"
        file: "data/reproducteurs.json"
        fields:
          - label: "Reproducteurs"
            name: "reproducteurs"
            widget: "list"
            summary: "{{nom}}"
            fields:
              - {label: "Nom", name: "nom", widget: "string"}
              - {label: "Chatterie d'origine", name: "chatterie_origine", widget: "string", required: false}
              - {label: "Couleur", name: "couleur", widget: "string"}
              - {label: "Lignée", name: "lignee", widget: "string"}
              - {label: "Date de naissance", name: "date_naissance", widget: "string", required: false}
              - {label: "Titre (résultats d'exposition)", name: "titre", widget: "string", required: false}
              - label: "Prix de la saillie (en €, sans le symbole)"
                name: "prix_saillie"
                widget: "string"
                required: false
                hint: "ex : 400"
              - label: "Caractère"
                name: "caractere"
                widget: "string"
                hint: "Une courte phrase, affichée entre guillemets"
              - {label: "Père", name: "pere", widget: "string", required: false}
              - {label: "Mère", name: "mere", widget: "string", required: false}
              - label: "Photo"
                name: "photo"
                widget: "image"
                required: false
                media_folder: "/images/chats"
                public_folder: "/images/chats"
              - label: "Afficher sur la page Reproducteurs"
                name: "visible"
                widget: "boolean"
                default: true
                hint: "Décoche pour le masquer de la liste publique — il pourra quand même s'afficher comme père sur la fiche d'un chaton."
