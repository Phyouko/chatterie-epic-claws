backend:
  name: git-gateway
  branch: main

media_folder: "/images/chatons"
public_folder: "/images/chatons"

collections:
  - name: "chatons"
    label: "Chatons disponibles"
    files:
      - name: "liste"
        label: "Liste des chatons"
        file: "data/chatons.json"
        fields:
          - label: "Chatons"
            name: "chatons"
            widget: "list"
            summary: "{{nom}} — {{statut}}"
            fields:
              - {label: "Nom", name: "nom", widget: "string"}
              - label: "Sexe"
                name: "sexe"
                widget: "select"
                options: ["Mâle", "Femelle"]
              - {label: "Couleur", name: "couleur", widget: "string"}
              - {label: "Lignée", name: "lignee", widget: "string", required: false}
              - label: "Date de naissance"
                name: "date_naissance"
                widget: "string"
                required: false
                hint: "ex : 17/08/2026"
              - label: "Prix"
                name: "prix"
                widget: "string"
                hint: "ex : 1500€"
              - label: "Statut"
                name: "statut"
                widget: "select"
                options: ["Disponible", "Réservé", "Adopté"]
                default: "Disponible"
                hint: "Adopté : le chaton quitte la liste des disponibles et rejoint la page « Ils ont trouvé leur famille ». Sa fiche reste en ligne."
              - label: "Photo principale"
                name: "photo"
                widget: "image"
                required: false
              - label: "Autres photos (carrousel sur sa fiche)"
                name: "photos_supplementaires"
                widget: "list"
                required: false
                field: {label: "Photo", name: "image", widget: "image"}
                hint: "Optionnel : ajoutées sous la photo principale, cliquables pour les afficher en grand."
              - label: "Accroche (affichée sous la photo sur sa fiche)"
                name: "tagline"
                widget: "string"
                required: false
                hint: "Une phrase courte et vendeuse, ex : Un petit lion roux plein de malice"
              - label: "Traits de caractère"
                name: "traits"
                widget: "select"
                multiple: true
                required: false
                options: ["Joueur", "Curieux", "Sociable", "Câlin", "Calme", "Affectueux", "Indépendant", "Gourmand", "Vif", "Attachant", "Casse-cou", "Discret", "Bavard", "Craintif au début"]
                hint: "Choisis les mots qui décrivent le mieux son caractère (plusieurs choix possibles), affichés sur sa fiche."
              - label: "Père"
                name: "pere"
                widget: "string"
                required: false
                hint: "Tape le nom exact d'un de tes Reproducteurs pour créer un lien automatique vers sa fiche, sinon juste le nom en texte."
              - label: "Mère"
                name: "mere"
                widget: "string"
                required: false
                hint: "Tape le nom exact d'une de tes Reproductrices pour créer un lien automatique vers sa fiche, sinon juste le nom en texte."
              - label: "Nombre de chatons de la portée"
                name: "portee_nombre"
                widget: "number"
                value_type: "int"
                min: 1
                required: false
                hint: "Mention obligatoire dans une annonce de vente. Affichée en bas de sa fiche."
              - label: "Mot de la famille (une fois adopté)"
                name: "temoignage"
                widget: "text"
                required: false
                hint: "Optionnel : une phrase de la famille, affichée sur sa fiche et dans la galerie des chatons adoptés."
              - label: "Signature du mot de la famille"
                name: "temoignage_auteur"
                widget: "string"
                required: false
                hint: "ex : Benoit, Perpignan"
              - label: "Afficher sur la page Chatons disponibles"
                name: "visible"
                widget: "boolean"
                default: true
                hint: "Décoche pour le masquer de la liste publique — sa fiche reste accessible si quelqu'un a le lien direct."

  - name: "reproductrices"
    label: "Nos Reproductrices"
    files:
      - name: "liste"
        label: "Liste des reproductrices"
        file: "data/reproductrices.json"
        fields:
          - label: "Reproductrices"
            name: "reproductrices"
            widget: "list"
            summary: "{{nom}}"
            fields:
              - {label: "Nom", name: "nom", widget: "string"}
              - {label: "Chatterie d'origine", name: "chatterie_origine", widget: "string", required: false}
              - {label: "Couleur", name: "couleur", widget: "string"}
              - {label: "Lignée", name: "lignee", widget: "string"}
              - {label: "Date de naissance", name: "date_naissance", widget: "string", required: false}
              - label: "Caractère"
                name: "caractere"
                widget: "string"
                hint: "Une courte phrase, affichée entre guillemets"
              - {label: "Père", name: "pere", widget: "string", required: false}
              - {label: "Mère", name: "mere", widget: "string", required: false}
              - label: "Photo"
                name: "photo"
                widget: "image"
                required: false
                media_folder: "/images/chats"
                public_folder: "/images/chats"
              - label: "Autres photos (sur sa fiche complète)"
                name: "photos_supplementaires"
                widget: "list"
                required: false
                field: {label: "Photo", name: "image", widget: "image", media_folder: "/images/chats", public_folder: "/images/chats"}
              - label: "Présentation (sur sa fiche complète)"
                name: "presentation"
                widget: "text"
                required: false
                hint: "Quelques lignes sur elle : son histoire, son caractère, ce qu'elle transmet à ses chatons."
              - label: "Tests de santé"
                name: "tests_sante"
                widget: "list"
                required: false
                summary: "{{test}} : {{resultat}}"
                hint: "Un test par ligne. Rien n'est affiché tant que la liste est vide."
                fields:
                  - {label: "Test", name: "test", widget: "string", hint: "ex : HCM (test ADN), SMA, PKDef, échographie cardiaque"}
                  - {label: "Résultat", name: "resultat", widget: "string", hint: "ex : N/N (négatif) — ou — Normale, mars 2026"}
              - label: "Numéro d'identification (puce)"
                name: "identification"
                widget: "string"
                required: false
                hint: "Mention obligatoire dans une annonce de vente : il s'affiche en bas de la fiche de ses chatons."
              - label: "Afficher sur la page Reproductrices"
                name: "visible"
                widget: "boolean"
                default: true
                hint: "Décoche pour la masquer de la liste publique — elle pourra quand même s'afficher comme mère sur la fiche d'un chaton."

  - name: "articles"
    label: "Nos Articles"
    files:
      - name: "liste"
        label: "Liste des articles"
        file: "data/articles.json"
        fields:
          - label: "Articles"
            name: "articles"
            widget: "list"
            summary: "{{titre}} — {{date}}"
            fields:
              - {label: "Titre", name: "titre", widget: "string"}
              - label: "Identifiant pour le lien (slug)"
                name: "slug"
                widget: "string"
                hint: "Sans espace ni accent ni majuscule, ex : mon-super-article. Ne le change plus une fois publié."
              - {label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false}
              - label: "Extrait (affiché dans la liste des articles)"
                name: "extrait"
                widget: "text"
                hint: "2-3 phrases maximum"
              - label: "Image de couverture"
                name: "image"
                widget: "image"
                required: false
                media_folder: "/images/articles"
                public_folder: "/images/articles"
              - label: "Contenu de l'article"
                name: "corps"
                widget: "markdown"
                media_folder: "/images/articles"
                public_folder: "/images/articles"
              - label: "Publié sur le site"
                name: "visible"
                widget: "boolean"
                default: true
                hint: "Décoché = brouillon : l'article reste ici mais n'apparaît pas sur le site. Coche pour le publier."
              - label: "Titre court pour Google (optionnel)"
                name: "titre_seo"
                widget: "string"
                required: false
                hint: "45 caractères maximum, c'est la ligne bleue dans Google. Laisse vide pour reprendre le titre de l'article."
              - label: "Description pour Google (optionnel)"
                name: "description_seo"
                widget: "text"
                required: false
                hint: "Une ou deux phrases complètes, 155 caractères maximum. Laisse vide pour reprendre l'extrait."

  - name: "reproducteurs"
    label: "Nos Reproducteurs"
    files:
      - name: "liste"
        label: "Liste des reproducteurs"
        file: "data/reproducteurs.json"
        fields:
          - label: "Reproducteurs"
            name: "reproducteurs"
            widget: "list"
            summary: "{{nom}}"
            fields:
              - {label: "Nom", name: "nom", widget: "string"}
              - {label: "Chatterie d'origine", name: "chatterie_origine", widget: "string", required: false}
              - {label: "Couleur", name: "couleur", widget: "string"}
              - {label: "Lignée", name: "lignee", widget: "string"}
              - {label: "Date de naissance", name: "date_naissance", widget: "string", required: false}
              - {label: "Titre (résultats d'exposition)", name: "titre", widget: "string", required: false}
              - label: "Prix de la saillie (en €, sans le symbole)"
                name: "prix_saillie"
                widget: "string"
                required: false
                hint: "ex : 400"
              - label: "Caractère"
                name: "caractere"
                widget: "string"
                hint: "Une courte phrase, affichée entre guillemets"
              - {label: "Père", name: "pere", widget: "string", required: false}
              - {label: "Mère", name: "mere", widget: "string", required: false}
              - label: "Photo"
                name: "photo"
                widget: "image"
                required: false
                media_folder: "/images/chats"
                public_folder: "/images/chats"
              - label: "Autres photos (sur sa fiche complète)"
                name: "photos_supplementaires"
                widget: "list"
                required: false
                field: {label: "Photo", name: "image", widget: "image", media_folder: "/images/chats", public_folder: "/images/chats"}
              - label: "Présentation (sur sa fiche complète)"
                name: "presentation"
                widget: "text"
                required: false
                hint: "Quelques lignes sur lui : son histoire, son caractère, ce qu'il transmet à ses chatons."
              - label: "Tests de santé"
                name: "tests_sante"
                widget: "list"
                required: false
                summary: "{{test}} : {{resultat}}"
                hint: "Un test par ligne. Rien n'est affiché tant que la liste est vide."
                fields:
                  - {label: "Test", name: "test", widget: "string", hint: "ex : HCM (test ADN), SMA, PKDef, échographie cardiaque"}
                  - {label: "Résultat", name: "resultat", widget: "string", hint: "ex : N/N (négatif) — ou — Normale, mars 2026"}
              - label: "Afficher sur la page Reproducteurs"
                name: "visible"
                widget: "boolean"
                default: true
                hint: "Décoche pour le masquer de la liste publique — il pourra quand même s'afficher comme père sur la fiche d'un chaton."

  - name: "liste_attente"
    label: "Liste d'attente"
    files:
      - name: "reglages"
        label: "Prochaine portée et places restantes"
        file: "data/liste-attente.json"
        fields:
          - label: "Prochaine portée prévue"
            name: "prochaine_portee"
            widget: "string"
            required: false
            hint: "ex : Printemps 2027. Laisse vide tant que tu ne sais pas."
          - label: "Parents de la portée"
            name: "parents"
            widget: "string"
            required: false
            hint: "ex : Arya × Yoda (affiché sous la date)"
          - label: "Nombre total de places sur la liste"
            name: "places_total"
            widget: "number"
            value_type: "int"
            min: 0
            required: false
            hint: "Les places restantes se calculent toutes seules (total - inscrits). Laisse vide pour ne rien afficher."
          - label: "Déjà inscrits en dehors du site"
            name: "places_deja_prises"
            widget: "number"
            value_type: "int"
            min: 0
            required: false
            hint: "Personnes que tu as inscrites toi-même (téléphone, Facebook...). Elles sont retirées des places restantes. Les inscrits du site sont comptés automatiquement."

  - name: "reglages"
    label: "Réglages du site"
    files:
      - name: "legal"
        label: "Informations légales et Google"
        file: "data/reglages.json"
        fields:
          - label: "Nom et prénom de l'éleveur (ou raison sociale)"
            name: "nom_eleveur"
            widget: "string"
            required: false
            hint: "Affiché dans les mentions légales comme responsable de la publication."
          - label: "Statut"
            name: "statut_juridique"
            widget: "string"
            required: false
            hint: "ex : Entrepreneur individuel, Micro-entreprise, Association..."
          - label: "Numéro SIREN"
            name: "siren"
            widget: "string"
            required: false
            hint: "9 chiffres. Obligatoire pour vendre des chatons : il s'affiche en bas de toutes les pages, dans les mentions légales et sur chaque fiche chaton."
          - label: "Adresse postale"
            name: "adresse"
            widget: "text"
            required: false
            hint: "Affichée dans les mentions légales. Laisse vide pour n'afficher que « Le Soler (66270) »."
          - label: "E-mail de contact"
            name: "email"
            widget: "string"
            required: false
            hint: "Optionnel : affiché dans les mentions légales."
          - label: "Inscription des chatons à un livre généalogique"
            name: "livre_genealogique"
            widget: "string"
            required: false
            hint: "Mention obligatoire dans une annonce : écris la phrase telle qu'elle doit s'afficher sur les fiches chatons."
          - label: "Autre mention (optionnel)"
            name: "mention_libre"
            widget: "text"
            required: false
            hint: "ex : numéro de certificat de capacité (ACACED), numéro d'élevage..."
          - label: "Code Google Search Console"
            name: "google_site_verification"
            widget: "string"
            required: false
            hint: "Colle ici la balise HTML donnée par Google Search Console (ou seulement le code entre guillemets après content=)."
