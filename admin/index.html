<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administration — Chatterie Epic Claws</title>
  <meta name="robots" content="noindex, nofollow">
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
  <script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <a href="/admin/inscrits.html" style="position:fixed;right:16px;bottom:16px;z-index:9999;background:#c79a3d;color:#1c110a;border:1px solid #8a6a26;border-radius:999px;padding:11px 18px;font:600 13px/1 system-ui,sans-serif;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.3)">Voir les inscrits à la liste d'attente</a>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", (user) => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
