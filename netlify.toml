# Le site est construit dans dist/ par scripts/build.py (pages d'articles et de chatons pour Google,
# optimisation automatique des images, sitemap). Si la construction échoue pour une raison quelconque,
# la commande de secours publie le site tel quel : il ne peut pas se retrouver cassé ou vide.
[build]
  publish = "dist"
  command = "python3 -m pip install -r requirements.txt && (python3 -m pip install -r requirements-images.txt || true) && python3 scripts/build.py || (rm -rf dist && mkdir -p dist && tar --exclude=./dist --exclude=./.git --exclude=./scripts -cf - . | tar -xf - -C dist)"

[build.environment]
  PIP_BREAK_SYSTEM_PACKAGES = "1"
  PIP_DISABLE_PIP_VERSION_CHECK = "1"

# Les images ont des noms uniques (le CMS les horodate) : on les garde 7 jours en cache chez le visiteur
# au lieu de les revalider à chaque page, ce qui accélère les visites suivantes.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
